[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "chassis"
version = "0.0.1"
description = "A local command foundation for parallel ventures."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3", "PyYAML>=6,<7"]

[project.scripts]
chassis = "chassis.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/chassis"]
