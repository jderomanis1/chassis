[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "chassis"
version = "0.0.1"
description = "A local command foundation for parallel ventures."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
portal = ["starlette>=1.10,<2", "uvicorn>=0.54,<1"]

[project.scripts]
chassis = "chassis.cli:main"
chassis-mcp = "chassis.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/chassis"]
