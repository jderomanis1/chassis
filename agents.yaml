# Policy contract. Every record read and write requires a verified agent token.
# assigned_agent on a record never supplies caller identity or permissions.
version: 1
unknown_agent: deny
agents:
  chief-of-staff:
    clearance: restricted
    ventures:
      venture-ridgeview:
        venture: write
        initiative: write
        task: write
      venture-acme:
        venture: write
        initiative: write
        task: write
  reviewer:
    ventures:
      venture-ridgeview:
        venture: read
        initiative: read
        task: read
      venture-acme:
        venture: read
        initiative: read
        task: read
