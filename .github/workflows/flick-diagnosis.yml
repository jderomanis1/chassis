name: Flick flake diagnosis

on:
  push:
    branches: [codex/flick-flake-diagnosis]
    paths: [.github/workflows/flick-diagnosis.yml]

permissions:
  contents: read

jobs:
  flick:
    name: Flick hide, 30 repeats
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies and browser
        run: |
          uv sync --locked --all-extras --python 3.12
          cd frontend
          npm install -g npm@11.9.0
          npm ci
          npx playwright install --with-deps chromium
      - name: Run x1.spec.mjs line 10 thirty times
        working-directory: frontend
        env:
          CI: "true"
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/flick-report.json
        run: |
          export CHASSIS_CHROMIUM="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          npx playwright test x1.spec.mjs:10 --repeat-each=30 --workers=1 --retries=0 \
            --trace=retain-on-failure --reporter=list,json --output=../flick-results
      - name: Save results and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flick-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            flick-report.json
            flick-results/**/trace.zip
            flick-results/**/error-context.md
          if-no-files-found: error
          retention-days: 30
