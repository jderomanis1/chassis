name: CI

on:
  pull_request:
    branches: [step7-c1-write, main, cursor/inc-4a-poll-keep-8f6d, cursor/i041-poll-followups-8f6d]
  push:
    branches: [step7-c1-write, main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all-extras
            args: --locked --all-extras
          - name: core
            args: --locked
          - name: portal
            args: --locked --extra portal
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"

      - name: Set up Node
        if: matrix.name == 'all-extras'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the pinned npm
        if: matrix.name == 'all-extras'
        run: npm install -g npm@11.9.0

      - name: Run locked Python tests
        run: |
          uv sync ${{ matrix.args }} --python 3.12
          .venv/bin/pytest -q

      - name: Install frontend dependencies
        if: matrix.name == 'all-extras'
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests and production audit
        if: matrix.name == 'all-extras'
        working-directory: frontend
        run: |
          npm test
          npm audit --omit=dev

      - name: Confirm Playwright uses the committed canvas assets
        if: matrix.name == 'all-extras'
        run: |
          git diff --exit-code -- frontend/src/prototype.css src/chassis/portal/static
          test "$(wc -c < frontend/src/prototype.css)" -gt 20000
          css=$(grep -o 'assets/index-[^"]*\.css' src/chassis/portal/static/index.html)
          test -n "$css"
          test "$(wc -c < "src/chassis/portal/static/$css")" -gt 20000

      - name: Install Playwright Chromium
        if: matrix.name == 'all-extras'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        if: matrix.name == 'all-extras'
        working-directory: frontend
        env:
          CI: "true"
        run: |
          export CHASSIS_CHROMIUM="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          npx playwright test

      - name: Upload Playwright report
        if: failure() && matrix.name == 'all-extras'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: .chassis/playwright-report
          if-no-files-found: ignore
