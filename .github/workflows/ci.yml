name: CI

on:
  pull_request:
    branches: [step7-c1-write, main]
  push:
    branches: [step7-c1-write, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the pinned npm
        run: npm install -g npm@11.9.0

      - name: Run locked Python tests
        run: |
          uv sync --locked --all-extras --python 3.12
          .venv/bin/pytest -q

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests and production audit
        working-directory: frontend
        run: |
          npm test
          npm audit --omit=dev

      - name: Confirm Playwright uses the committed canvas assets
        run: |
          git diff --exit-code -- frontend/src/prototype.css src/chassis/portal/static
          test "$(wc -c < frontend/src/prototype.css)" -gt 20000
          css=$(grep -o 'assets/index-[^"]*\.css' src/chassis/portal/static/index.html)
          test -n "$css"
          test "$(wc -c < "src/chassis/portal/static/$css")" -gt 20000

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend
        env:
          CI: "true"
        run: |
          export CHASSIS_CHROMIUM="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: .chassis/playwright-report
          if-no-files-found: ignore
