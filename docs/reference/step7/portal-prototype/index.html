<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chassis | Command center (prototype)</title>
<script>
/* Theme before first paint (no flash). Order: ?theme=light|dark (session only, never stored) > localStorage 'chassis-theme' > prefers-color-scheme. */
(function(){var d=document.documentElement,p=new URLSearchParams(location.search).get("theme"),s=null;
try{s=localStorage.getItem("chassis-theme")}catch(e){}
var t=(p==="light"||p==="dark")?p:(s==="light"||s==="dark")?s:(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");
d.setAttribute("data-theme",t);if(p==="light"||p==="dark")d.setAttribute("data-theme-session","1");})();
</script>
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CHASSIS DESIGN TOKENS (mirrored in tokens.json -> themes.dark / themes.light)
   Both themes override the SAME variable names. Every ratio below is computed by
   tools/contrast.py (WCAG 2.x relative luminance) against the real composited
   background: card = glass panel over the page. Run: python3 tools/contrast.py

   DARK  page #05080E | card #0D1521 | raise #132033 | drawer #0C1522
   --text   #E7EEF6  17.14 page | 15.67 card | 14.01 raise | 15.67 drawer
   --text-2 #A3B4C7   9.46 page |  8.65 card |  7.73 raise |  8.65 drawer
   --text-3 #7D92A9   6.26 page |  5.72 card |  5.11 raise |  5.72 drawer
   --cyan   #43E3FF  13.05 page | 11.93 card | 10.66 raise | 11.93 drawer
   --amber  #FFB547  11.41 page | 10.43 card |  9.32 raise | 10.43 drawer
   --red    #FF6B70   7.24 page |  6.62 card |  5.92 raise |  6.62 drawer
   --green  #4BE3A0  12.21 page | 11.16 card |  9.98 raise | 11.16 drawer
   --slate  #93A4BC   7.90 page |  7.22 card |  6.46 raise |  7.22 drawer
   pills (text on 14% own tint over card): cyan 8.75 | amber 8.00 | red 5.52 | green 8.32 | slate 5.77
   button #05080E on cyan 13.05 | restricted amber on stripe 9.41
   LOWEST DARK: 5.11 (text-3 on raise). Bars/focus rings need 3:1; all pass.

   LIGHT  page #EAEFF5 | card #FAFCFD | raise #E2E8F0 | drawer #F6F8FB
   --text   #0A1A2F  15.11 page | 16.98 card | 14.18 raise | 16.43 drawer
   --text-2 #33455D   8.45 page |  9.49 card |  7.92 raise |  9.18 drawer
   --text-3 #4F6077   5.55 page |  6.24 card |  5.21 raise |  6.03 drawer
   --cyan   #086C93   5.08 page |  5.71 card |  4.76 raise |  5.52 drawer
   --amber  #8A5200   5.52 page |  6.21 card |  5.18 raise |  6.00 drawer
   --red    #BB2532   5.31 page |  5.96 card |  4.98 raise |  5.77 drawer
   --green  #0A7044   5.32 page |  5.98 card |  4.99 raise |  5.78 drawer
   --slate  #55667F   5.05 page |  5.68 card |  4.74 raise |  5.49 drawer
   pills (text on 11% own tint over card): cyan 4.87 | amber 5.29 | red 4.98 | green 5.11 | slate 4.92
   button #FFFFFF on cyan 5.87 | restricted amber on stripe 5.52
   LOWEST LIGHT: 4.74 (slate on raise). Bars/focus rings need 3:1; all pass.

   Hairlines and glows are decorative only, never the sole carrier of meaning.
   ============================================================ */
:root{
  --font-display:"Chakra Petch",ui-sans-serif,sans-serif;
  --font-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
  --fs-micro:11px; --fs-sm:13px; --fs-body:15px; --fs-lg:18px; --fs-xl:24px; --fs-num:44px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --ease:cubic-bezier(.2,.8,.2,1); --dur-fast:140ms; --dur:260ms; --dur-slow:520ms;
}
:root,:root[data-theme="dark"]{
  color-scheme:dark;
  --bg-0:#05080E; --bg-1:#0A111B; --panel:#0E1724; --raise:#132033; --drawer:#0C1522;
  --glass:rgba(14,23,36,.86); --ask-bg:rgba(10,17,27,.92);
  --header-bg:linear-gradient(180deg,rgba(5,8,14,.96),rgba(5,8,14,.82));
  --line:rgba(120,180,220,.14); --line-strong:rgba(120,180,220,.28);
  --text:#E7EEF6; --text-2:#A3B4C7; --text-3:#7D92A9;
  --cyan:#43E3FF; --amber:#FFB547; --red:#FF6B70; --green:#4BE3A0; --slate:#93A4BC;
  --on-accent:#05080E; --bar-hi:#8AF0FF; --tint:14%; --stripe:6%; --glow-a:35%;
  --glow-cyan:0 0 0 1px rgba(67,227,255,.35),0 0 24px rgba(67,227,255,.18);
  --glow-red:0 0 0 1px rgba(255,107,112,.45),0 0 22px rgba(255,107,112,.2);
  --elev-1:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px rgba(0,0,0,.35);
  --elev-2:0 1px 0 rgba(255,255,255,.05) inset,0 18px 48px rgba(0,0,0,.55);
  --scan:rgba(255,255,255,.018); --sheen:rgba(67,227,255,.06);
  --bg-glow-a:rgba(67,227,255,.10); --bg-glow-b:rgba(255,181,71,.05);
  --scrim:rgba(2,4,8,.55); --lane-bg:rgba(10,17,27,.4); --mask-a:#132033; --mask-b:#1B2A40;
  --glare:rgba(67,227,255,.16); --tick-a:.55; --shimmer:rgba(255,255,255,.18);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg-0:#EAEFF5; --bg-1:#F3F6F9; --panel:#FBFCFD; --raise:#E2E8F0; --drawer:#F6F8FB;
  --glass:rgba(253,254,255,.84); --ask-bg:rgba(251,252,254,.94);
  --header-bg:linear-gradient(180deg,rgba(243,246,249,.96),rgba(243,246,249,.84));
  --line:rgba(30,70,120,.07); --line-strong:rgba(30,70,120,.17);
  --text:#0A1A2F; --text-2:#33455D; --text-3:#4F6077;
  --cyan:#086C93; --amber:#8A5200; --red:#BB2532; --green:#0A7044; --slate:#55667F;
  --on-accent:#FFFFFF; --bar-hi:#1E9BC8; --tint:11%; --stripe:8%; --glow-a:0%;
  --glow-cyan:0 0 0 1px rgba(8,108,147,.38),0 10px 30px rgba(8,108,147,.16);
  --glow-red:0 0 0 1px rgba(187,37,50,.42),0 10px 28px rgba(187,37,50,.14);
  --elev-1:0 1px 0 rgba(255,255,255,.95) inset,0 1px 2px rgba(20,40,70,.06),0 8px 24px rgba(20,40,70,.07);
  --elev-2:0 1px 0 #fff inset,0 2px 6px rgba(20,40,70,.08),0 24px 48px rgba(20,40,70,.14);
  --scan:rgba(20,40,70,.012); --sheen:rgba(255,255,255,.75);
  --bg-glow-a:rgba(8,108,147,.10); --bg-glow-b:rgba(138,82,0,.05);
  --scrim:rgba(20,35,60,.22); --lane-bg:rgba(255,255,255,.5); --mask-a:#E2E8F0; --mask-b:#C9D3E0;
  --glare:rgba(8,108,147,.10); --tick-a:.7; --shimmer:rgba(255,255,255,.75);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg-0);color:var(--text);font:400 var(--fs-body)/1.5 var(--font-body);-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(1200px 600px at 75% -10%,var(--bg-glow-a),transparent 60%),
    radial-gradient(900px 500px at -10% 110%,var(--bg-glow-b),transparent 60%),
    linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:auto,auto,48px 48px,48px 48px;background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;
  background:repeating-linear-gradient(0deg,var(--scan) 0 1px,transparent 1px 3px)}
a{color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--cyan);color:var(--on-accent);padding:8px 12px;border-radius:6px;z-index:200}
.skip:focus{left:8px}
.mono{font-family:var(--font-mono);font-size:var(--fs-micro);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.num{font-family:var(--font-display);font-weight:600;font-variant-numeric:tabular-nums}
.c-cy{color:var(--cyan)}

/* header */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:var(--sp-5);padding:14px 28px;
  background:var(--header-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);view-transition-name:topbar}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand svg{color:var(--cyan)} .brand svg rect{fill:var(--amber)}
.brand b{font:700 22px/1 var(--font-display);letter-spacing:.06em}
.brand small{display:block}
nav.tabs{display:flex;gap:4px;margin-left:var(--sp-4)}
nav.tabs a{font:500 var(--fs-sm) var(--font-body);color:var(--text-2);text-decoration:none;padding:8px 14px;border-radius:var(--r-pill);border:1px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--text);border-color:var(--line-strong);background:color-mix(in srgb,var(--cyan) 8%,transparent)}
nav.tabs a:hover{color:var(--text)}
.live{margin-left:auto;display:flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);position:relative}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--green);animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.6}80%,100%{transform:scale(2.6);opacity:0}}
.theme-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 10px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:var(--glass);color:var(--text);font:500 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.theme-btn:hover{border-color:var(--cyan)}
.theme-btn svg{color:var(--cyan)}
.theme-btn .sun{display:none} [data-theme="light"] .theme-btn .sun{display:block} [data-theme="light"] .theme-btn .moon{display:none}

main{max-width:1360px;margin:0 auto;padding:22px 28px 150px;view-transition-name:page}
.crumbs{display:flex;gap:8px;align-items:center;margin-bottom:var(--sp-4);flex-wrap:wrap}
.crumbs a{color:var(--text-2);text-decoration:none;font-size:var(--fs-sm)}
.crumbs a:hover{color:var(--cyan)}
.crumbs span[aria-current]{color:var(--text);font-size:var(--fs-sm)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line-strong);color:var(--text);border-radius:var(--r-pill);padding:5px 12px;font:500 var(--fs-sm) var(--font-body);cursor:pointer;text-decoration:none}
.back:hover{border-color:var(--cyan)}
h1{font:600 30px/1.15 var(--font-display);letter-spacing:.02em;margin:0 0 6px}
h2{font:600 var(--fs-lg)/1.2 var(--font-display);letter-spacing:.03em;margin:0}
.lede{color:var(--text-2);margin:0 0 var(--sp-5)}

.panel{background:var(--glass);border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:var(--elev-1);position:relative}
[data-theme="dark"] .panel{border-color:var(--line)}
.panel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,var(--sheen),transparent 35%)}
.ticks::after{content:"";position:absolute;inset:-1px;pointer-events:none;border-radius:inherit;opacity:var(--tick-a);
  background:
   linear-gradient(var(--cyan),var(--cyan)) top left/14px 1px no-repeat,linear-gradient(var(--cyan),var(--cyan)) top left/1px 14px no-repeat,
   linear-gradient(var(--cyan),var(--cyan)) bottom right/14px 1px no-repeat,linear-gradient(var(--cyan),var(--cyan)) bottom right/1px 14px no-repeat}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-4);margin-bottom:var(--sp-4)}
.stat{padding:16px 20px}
.stat .num{font-size:var(--fs-num);line-height:1;display:block;margin:8px 0 4px}
.stat .sub{color:var(--text-2);font-size:var(--fs-sm)}
.stat.alert .num{color:var(--red);text-shadow:0 0 18px color-mix(in srgb,var(--red) var(--glow-a),transparent)}
.stat.cy .num{color:var(--cyan);text-shadow:0 0 18px color-mix(in srgb,var(--cyan) var(--glow-a),transparent)}
.attn{display:flex;align-items:center;gap:14px;padding:12px 16px;margin-bottom:var(--sp-5);border-color:color-mix(in srgb,var(--red) 40%,transparent)!important;width:100%;text-align:left;cursor:pointer;color:var(--text);font:inherit}
.attn:hover{box-shadow:var(--glow-red)}
.attn .tag{font:600 var(--fs-micro) var(--font-mono);letter-spacing:.1em;color:var(--red);border:1px solid color-mix(in srgb,var(--red) 55%,transparent);padding:3px 8px;border-radius:var(--r-sm)}
.attn .go{margin-left:auto;color:var(--text-2);font-size:var(--fs-sm)}

/* tiles + tilt (transform only; glow is a translated blob) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:var(--sp-4);perspective:1200px}
.tile{display:block;text-decoration:none;padding:18px 20px;--rx:0deg;--ry:0deg;--lift:0px;
  transform:rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--lift));
  transition:transform 520ms var(--ease),box-shadow var(--dur) var(--ease),border-color var(--dur)}
.tile.hot{transition:transform 120ms ease-out,box-shadow var(--dur) var(--ease),border-color var(--dur)}
.tile:hover,.tile:focus-visible{--lift:-4px;box-shadow:var(--glow-cyan),var(--elev-2);border-color:color-mix(in srgb,var(--cyan) 45%,transparent)}
.tile.has-block{border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.glare{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;opacity:0;transition:opacity 300ms var(--ease)}
.glare i{position:absolute;left:0;top:0;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%;
  background:radial-gradient(circle,var(--glare),transparent 62%);transform:translate3d(50%,50%,0)}
.tile.hot .glare{opacity:1}
.tile .row{display:flex;align-items:flex-start;gap:12px}
.tile h3{font:600 20px/1.2 var(--font-display);margin:2px 0 0;letter-spacing:.02em}
.blk{margin-left:auto;text-align:right;min-width:76px}
.blk .num{font-size:38px;line-height:1;display:block}
.blk.on .num{color:var(--red);text-shadow:0 0 16px color-mix(in srgb,var(--red) var(--glow-a),transparent)}
.blk.off .num{color:var(--text-3)}
.seg{display:flex;height:10px;border-radius:var(--r-pill);overflow:hidden;margin:16px 0 8px;background:var(--raise);gap:2px;transform-origin:left center}
.seg i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--text-2)}
.legend b{font-family:var(--font-display);color:var(--text);font-weight:600;margin-right:3px}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.kv{display:grid;grid-template-columns:118px 1fr;gap:6px 12px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-strong);font-size:var(--fs-sm)}
.kv dt{margin:0}.kv dd{margin:0;color:var(--text)}
.agent{color:var(--cyan);font-family:var(--font-mono);font-size:12px}
.sample-tag{font:600 10px var(--font-mono);letter-spacing:.12em;color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 55%,transparent);background:color-mix(in srgb,var(--amber) 8%,transparent);border-radius:4px;padding:2px 6px;text-transform:uppercase}
.tile.sample h3{color:var(--text-2)}
.section-h{display:flex;align-items:baseline;gap:12px;margin:var(--sp-6) 0 var(--sp-3)}

/* pills */
.pill{position:relative;display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:var(--r-pill);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-planned{color:var(--slate);background:color-mix(in srgb,var(--slate) var(--tint),transparent)}
.s-in_progress{color:var(--cyan);background:color-mix(in srgb,var(--cyan) var(--tint),transparent)}
.s-blocked{color:var(--red);background:color-mix(in srgb,var(--red) var(--tint),transparent)}
.s-done{color:var(--green);background:color-mix(in srgb,var(--green) var(--tint),transparent)}
.s-blocked::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--red) 55%,transparent),0 0 14px color-mix(in srgb,var(--red) 40%,transparent);opacity:0;animation:ring 2.6s ease-in-out infinite}
@keyframes ring{0%{opacity:0;transform:scale(1)}35%{opacity:.85}100%{opacity:0;transform:scale(1.22,1.4)}}
.c-planned{background:var(--slate)}.c-in_progress{background:var(--cyan)}.c-blocked{background:var(--red)}.c-done{background:var(--green)}

/* venture + initiative */
.vhead{display:grid;grid-template-columns:1.4fr 1fr;gap:var(--sp-4);margin-bottom:var(--sp-5)}
.vhead .panel{padding:20px 22px}
.init{padding:20px 22px;margin-bottom:var(--sp-4);display:grid;grid-template-columns:1fr 280px;gap:20px;align-items:start}
.init h3{font:600 20px/1.25 var(--font-display);margin:6px 0 4px}
.init h3 a{text-decoration:none}
.init h3 a:hover{color:var(--cyan)}
.bar{height:8px;border-radius:var(--r-pill);background:var(--raise);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;width:100%;transform-origin:left center;background:linear-gradient(90deg,var(--cyan),var(--bar-hi));box-shadow:0 0 12px color-mix(in srgb,var(--cyan) var(--glow-a),transparent)}
.grow{animation:grow 900ms var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes grow{from{transform:scaleX(0)}}
.stepper{display:flex;list-style:none;padding:0;margin:14px 0 0;gap:0}
.stepper li{flex:1;position:relative;padding-top:18px;font-size:12px;color:var(--text-3);text-align:center}
.stepper li::before{content:"";position:absolute;top:5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;border:2px solid var(--text-3);background:var(--panel);z-index:1}
.stepper li::after{content:"";position:absolute;top:9px;left:-50%;width:100%;height:2px;background:var(--line-strong)}
.stepper li:first-child::after{display:none}
.stepper li.done{color:var(--text-2)}
.stepper li.done::before{background:var(--cyan);border-color:var(--cyan)}
.stepper li.done::after{background:var(--cyan)}
.stepper li.now{color:var(--amber);font-weight:600}
.stepper li.now::before{border-color:var(--amber);box-shadow:0 0 0 4px color-mix(in srgb,var(--amber) 20%,transparent)}
.stepper li.now::after{background:var(--cyan)}
.nogtm{margin-top:14px;font-size:var(--fs-sm);color:var(--text-2);border:1px dashed var(--line-strong);border-radius:var(--r-md);padding:10px 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--cyan);color:var(--on-accent);border:0;border-radius:var(--r-pill);padding:9px 16px;font:600 var(--fs-sm) var(--font-body);cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-strong)}
.btn.ghost:hover{border-color:var(--cyan)}

/* tasks */
.tasks{display:grid;gap:10px}
.task{display:grid;grid-template-columns:130px 1.5fr 140px 1.3fr 24px;align-items:center;gap:16px;padding:14px 18px;width:100%;text-align:left;color:var(--text);font:inherit;cursor:pointer;transition:transform var(--dur-fast) var(--ease),box-shadow var(--dur-fast),border-color var(--dur-fast)}
.task:hover{transform:translateX(3px);border-color:color-mix(in srgb,var(--cyan) 45%,transparent);box-shadow:var(--glow-cyan)}
.task.is-blocked{border-color:color-mix(in srgb,var(--red) 45%,transparent)}
.task .t{font-weight:500}
.task .id{display:block;margin-top:2px}
.dep{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--font-mono);color:var(--cyan);background:color-mix(in srgb,var(--cyan) 8%,transparent);border:1px solid color-mix(in srgb,var(--cyan) 35%,transparent);border-radius:var(--r-sm);padding:4px 8px;cursor:pointer;text-decoration:none}
.dep:hover{background:color-mix(in srgb,var(--cyan) 16%,transparent)}
.dep.red{color:var(--red);background:color-mix(in srgb,var(--red) 8%,transparent);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
.th{display:grid;grid-template-columns:130px 1.5fr 140px 1.3fr 24px;gap:16px;padding:0 18px 4px}
.restricted-bg,.task.restricted{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--amber) var(--stripe),transparent) 0 10px,transparent 10px 20px),var(--glass)}
.task.restricted{border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.lock{color:var(--amber)}
.masked{display:inline-block;height:10px;width:180px;border-radius:3px;background:linear-gradient(90deg,var(--mask-a),var(--mask-b),var(--mask-a));vertical-align:middle}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity var(--dur);z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--drawer);border-left:1px solid var(--line-strong);box-shadow:-30px 0 60px rgba(0,0,0,.35);
  transform:translateX(102%);transition:transform var(--dur) var(--ease);z-index:50;display:flex;flex-direction:column}
[data-theme="light"] .drawer{box-shadow:-24px 0 60px rgba(20,40,70,.16)}
.drawer.on{transform:none}
.drawer::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--cyan),transparent 70%);opacity:.8}
.drawer header{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line-strong)}
.drawer .x{margin-left:auto;background:none;border:1px solid var(--line-strong);color:var(--text);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px}
.drawer .body{padding:22px;overflow:auto;flex:1}
.drawer h2{font-size:22px;margin:8px 0 12px}
.drawer .kv{grid-template-columns:120px 1fr;border-top:1px solid var(--line-strong)}
.cite{font:500 12px var(--font-mono);color:var(--cyan);background:color-mix(in srgb,var(--cyan) 8%,transparent);border:1px solid color-mix(in srgb,var(--cyan) 35%,transparent);border-radius:4px;padding:1px 6px;cursor:pointer;text-decoration:none;white-space:nowrap}
.cite:hover{background:color-mix(in srgb,var(--cyan) 16%,transparent)}
.answer{position:relative}
.answer p{margin:0 0 12px;color:var(--text)}
.answer .q{color:var(--text-2);border-left:2px solid var(--cyan);padding-left:10px;margin-bottom:16px}
.ex{display:inline-block;font:600 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 55%,transparent);border-radius:4px;padding:3px 8px}
.w{opacity:0;transition:opacity 220ms ease-out}
.w.on{opacity:1}
.typing{overflow:hidden}
.typing::after{content:"";position:absolute;inset:-20% 0;pointer-events:none;width:40%;
  background:linear-gradient(100deg,transparent,var(--shimmer),transparent);mix-blend-mode:overlay;animation:sweep 1.1s linear infinite}
@keyframes sweep{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
.think{display:grid;gap:10px;margin-top:18px;position:relative;overflow:hidden}
.think i{display:block;height:12px;border-radius:6px;background:var(--raise)}
.think i:nth-child(2){width:86%}.think i:nth-child(3){width:64%}
.think::after{content:"";position:absolute;inset:0;width:45%;background:linear-gradient(100deg,transparent,color-mix(in srgb,var(--cyan) 22%,transparent),transparent);animation:sweep 1.1s linear infinite}
.lockbox{text-align:center;padding:30px 10px}
.lockbox svg{color:var(--amber);filter:drop-shadow(0 0 12px color-mix(in srgb,var(--amber) 35%,transparent))}

/* ask bar */
.ask{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(880px,calc(100% - 32px));z-index:30;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:12px;view-transition-name:askbar;
  background:var(--ask-bg);backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--cyan) 40%,transparent);border-radius:16px;box-shadow:var(--elev-2)}
.ask::before{content:"";position:absolute;inset:-4px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity 260ms var(--ease);
  box-shadow:0 0 0 2px var(--cyan),0 0 36px color-mix(in srgb,var(--cyan) 35%,transparent)}
.ask:focus-within::before{opacity:1}
.ask svg{color:var(--cyan)}
.ask input{flex:1;background:none;border:0;color:var(--text);font:400 16px var(--font-body);padding:8px 0;min-width:0}
.ask input::placeholder{color:var(--text-3)}
.ask input:focus{outline:none}
.kbd{font:500 11px var(--font-mono);color:var(--text-2);border:1px solid var(--line-strong);border-radius:5px;padding:3px 6px;white-space:nowrap}

/* hover card */
.hcard{position:fixed;left:0;top:0;z-index:60;width:300px;padding:14px 16px;border-radius:12px;pointer-events:none;opacity:0;
  background:var(--drawer);border:1px solid var(--line-strong);box-shadow:var(--elev-2);transition:opacity 160ms ease-out;will-change:transform,opacity}
.hcard.on{opacity:1}
.hcard h4{margin:4px 0 10px;font:600 15px/1.3 var(--font-display)}
.hcard dl{display:grid;grid-template-columns:78px 1fr;gap:6px 10px;margin:0;font-size:13px}
.hcard dd{margin:0}
.hcard .none{color:var(--text-2)}
.hcard.locked{border-color:color-mix(in srgb,var(--amber) 55%,transparent)}

/* map */
.mapwrap{height:calc(100vh - 290px);min-height:460px;overflow:hidden;position:relative;cursor:grab;touch-action:none}
.mapwrap.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:1180px;height:720px;transform-origin:0 0}
.world svg{position:absolute;inset:0;overflow:visible}
.lane{position:absolute;border:1px dashed var(--line-strong);border-radius:16px;background:var(--lane-bg)}
.lane .mono{position:absolute;top:-9px;left:16px;background:var(--bg-0);padding:0 8px;border-radius:4px}
.sublabel{position:absolute;font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);transition:opacity 220ms}
.node{position:absolute;width:240px;height:92px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line-strong);color:var(--text);text-align:left;font:inherit;cursor:pointer;box-shadow:var(--elev-1);transition:opacity 220ms var(--ease),box-shadow var(--dur-fast),border-color var(--dur-fast)}
.node:hover,.node:focus-visible,.node.src{border-color:var(--cyan);box-shadow:var(--glow-cyan)}
.node .t{display:block;font-weight:500;font-size:14px;line-height:1.3;margin-top:8px}
.node.blocked{border-color:color-mix(in srgb,var(--red) 65%,transparent);box-shadow:var(--glow-red)}
.node.done{border-color:color-mix(in srgb,var(--green) 50%,transparent)}
.node.restricted{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--amber) var(--stripe),transparent) 0 10px,transparent 10px 20px),var(--panel);border-color:color-mix(in srgb,var(--amber) 55%,transparent)}
.node::before,.node::after{content:"";position:absolute;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--bg-0);border:2px solid var(--text-3)}
.node::before{left:-6px}.node::after{right:-6px}
.edgeg{transition:opacity 220ms var(--ease)}
.edge{fill:none;stroke:var(--cyan);stroke-width:2;stroke-dasharray:6 6;animation:flow 1.2s linear infinite}
.edge.blocked{stroke:var(--red);stroke-width:2.5;animation-duration:.9s}
.edge-halo{fill:none;stroke:var(--cyan);stroke-width:10;opacity:0;transition:opacity 220ms var(--ease)}
.edge-halo.blocked{stroke:var(--red)}
.edgeg.lit .edge-halo{opacity:.22}
.edge-bg{fill:none;stroke:color-mix(in srgb,var(--cyan) 15%,transparent);stroke-width:6}
.edge-bg.blocked{stroke:color-mix(in srgb,var(--red) 18%,transparent)}
@keyframes flow{to{stroke-dashoffset:-24}}
.world.focus .node:not(.lit),.world.focus .edgeg:not(.lit),.world.focus .edgelabel:not(.lit),.world.focus .sublabel{opacity:.25}
.maptools{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:2}
.maptools button{width:36px;height:36px;border-radius:8px;background:var(--panel);border:1px solid var(--line-strong);color:var(--text);font:600 16px var(--font-mono);cursor:pointer}
.maptools button:hover{border-color:var(--cyan)}
.maplegend{position:absolute;left:14px;top:14px;z-index:2;padding:10px 14px;display:flex;gap:16px;font-size:12px;color:var(--text-2)}
.maplegend i{display:inline-block;width:22px;height:0;border-top:2px dashed var(--cyan);vertical-align:3px;margin-right:6px}
.maplegend i.r{border-color:var(--red)}
.edgelabel{position:absolute;font:600 10px var(--font-mono);letter-spacing:.1em;color:var(--red);background:var(--panel);border:1px solid color-mix(in srgb,var(--red) 55%,transparent);border-radius:4px;padding:2px 6px;transition:opacity 220ms}
.minimap{position:absolute;right:14px;bottom:14px;z-index:2;width:196px;height:120px;padding:6px;overflow:hidden}
.minimap svg{width:100%;height:100%;display:block}
.minimap .mm-node{rx:10;fill:var(--raise);stroke:var(--line-strong);stroke-width:4}
.minimap .mm-node.blocked{fill:color-mix(in srgb,var(--red) 35%,var(--raise));stroke:var(--red)}
.minimap .mm-node.done{stroke:var(--green)} .minimap .mm-node.in_progress{stroke:var(--cyan)}
.minimap .mm-node.restricted{fill:color-mix(in srgb,var(--amber) 25%,var(--raise));stroke:var(--amber)}
.minimap .mm-edge{stroke:var(--cyan);stroke-width:6;fill:none}.minimap .mm-edge.blocked{stroke:var(--red)}
.minimap .mm-view{fill:color-mix(in srgb,var(--cyan) 8%,transparent);stroke:var(--cyan);stroke-width:6}

.empty{padding:48px;text-align:center}
.fade-in{animation:fadeup var(--dur-slow) var(--ease) backwards}
@keyframes fadeup{from{opacity:0;translate:0 8px}}
.grid>.tile{animation:fadeup var(--dur-slow) var(--ease) backwards}
.foot{color:var(--text-3);font-size:12px;margin-top:var(--sp-6)}

/* page transitions (View Transitions API; fade-in class is the fallback) */
::view-transition-old(page){animation:vt-out 200ms var(--ease) both}
::view-transition-new(page){animation:vt-in 360ms var(--ease) both}
@keyframes vt-out{to{opacity:0;transform:translateY(-8px) scale(.995)}}
@keyframes vt-in{from{opacity:0;transform:translateY(12px)}}
::view-transition-group(hero){animation-duration:460ms;animation-timing-function:var(--ease)}
html.vt-nav::view-transition-old(root),html.vt-nav::view-transition-new(root){animation:none}
html.vt-nav .fade-in{animation:none}
::view-transition-old(root),::view-transition-new(root){animation-duration:320ms}

@media (max-width:900px){
  .strip{grid-template-columns:repeat(2,1fr)} .vhead,.init{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr} nav.tabs{display:none} .theme-btn .lbl{display:none}
  .task,.th{grid-template-columns:1fr} .th{display:none}
}
.still *,.still *::before,.still *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .tile:hover,.task:hover{transform:none}
}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="#/" aria-label="Chassis home">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H5v6M23 4h6v6M11 30H5v-6M23 30h6v-6"/><path d="M10 17h14M17 11v12" opacity=".5"/></g><rect x="14" y="14" width="6" height="6"/></svg>
    <span><b>CHASSIS</b><small class="mono">Chief of staff console</small></span>
  </a>
  <nav class="tabs" aria-label="Main">
    <a href="#/" data-tab="home">Overview</a>

  <div class="live" aria-live="off"><span class="dot" aria-hidden="true"></span><span class="mono">Live &middot; synced <span id="clock"></span> MST</span><span class="sample-tag" title="Prototype with fictional data">Prototype</span>
    <button class="theme-btn" id="themeToggle" type="button" aria-label="Switch theme">
      <svg class="moon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="sun" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
      <span class="lbl" id="themeLabel">Dark</span>

</header>

  <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg>
  <label for="ask" class="mono c-cy">Ask</label>
  <input id="ask" name="q" autocomplete="off" placeholder="Ask anything, e.g. What is blocking Ridgeview?">
  <span class="kbd" aria-hidden="true" id="kbdhint">Ctrl K</span>
  <button class="btn" type="submit">Ask</button>
</form>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true">
  <header><span class="mono" id="drawerKicker">Detail</span><button class="x" id="drawerClose" aria-label="Close panel">&times;</button></header>
  <div class="body" id="drawerBody"></div>
</aside>
<div class="hcard" id="hcard" role="tooltip" aria-hidden="true"></div>

<script>
/* ===== DATA =====
   Real fictional sample records from the Chassis repo, commit 9774ed4 (records/{ventures,initiatives,tasks}).
   The restricted task is represented by status and position only. Its id, title, owner and body are not included. */
const RECORD_TIME = "2026-11-16T12:00:00Z";
const ventures = [
  {id:"venture-ridgeview",title:"Ridgeview HOA",status:"in_progress",owner:"Morgan Vale",next_step:"Review maintenance estimates and approve the first resident update.",updated_at:RECORD_TIME,assigned_agent:"chief-of-staff"},
  {id:"venture-acme",title:"Acme D2C",status:"planned",owner:"Avery Quinn",next_step:"Validate the audience and shape the first launch offer.",updated_at:RECORD_TIME,assigned_agent:"chief-of-staff"}
];
const GTM = ["Positioning","Audience","Channels","Offer","Launch checklist","Success metrics"];
const initiatives = [
  {id:"initiative-maintenance",venture:"venture-ridgeview",title:"Plan the shared-space maintenance",status:"in_progress",owner:"Morgan Vale",next_step:"Compare fictional vendor estimates against the completed inventory.",gtm:null},
  {id:"initiative-resident-updates",venture:"venture-ridgeview",title:"Start a dependable resident update",status:"planned",owner:"Morgan Vale",next_step:"Draft a short FAQ and a sample monthly bulletin.",gtm:null},
  {id:"initiative-d2c-launch",venture:"venture-acme",title:"Shape the first desk-accessory launch",status:"planned",owner:"Avery Quinn",next_step:"Complete the sample audience interviews and draft the starter offer.",
   gtm:{sections:GTM,current:"Launch checklist",checklist:[0,3]}}
];
const tasks = [
  {id:"task-maintenance-inventory",parent:"initiative-maintenance",venture:"venture-ridgeview",title:"Inventory shared-space maintenance needs",status:"done",owner:"Morgan Vale",next_step:"Hand the fictional inventory to the estimate review owner.",depends_on:[]},
  {id:"task-maintenance-quotes",parent:"initiative-maintenance",venture:"venture-ridgeview",title:"Compare maintenance estimates",status:"in_progress",owner:"Morgan Vale",next_step:"Compare the sample estimates for scope and assumptions.",depends_on:["task-maintenance-inventory"]},
  {id:"task-maintenance-plan",parent:"initiative-maintenance",venture:"venture-ridgeview",title:"Draft the maintenance decision brief",status:"blocked",owner:"Morgan Vale",next_step:"Finish the estimate comparison before choosing a proposed sequence.",depends_on:["task-maintenance-quotes"]},
  {id:"task-resident-faq",parent:"initiative-resident-updates",venture:"venture-ridgeview",title:"Draft the resident FAQ",status:"planned",owner:"Morgan Vale",next_step:"Write five sample questions about common-area work.",depends_on:[]},
  {id:"task-resident-bulletin",parent:"initiative-resident-updates",venture:"venture-ridgeview",title:"Prepare the first monthly bulletin",status:"planned",owner:"Morgan Vale",next_step:"Draft a short priorities, progress, and questions bulletin.",depends_on:[]},
  {id:"task-audience-interviews",parent:"initiative-d2c-launch",venture:"venture-acme",title:"Summarize the sample audience interviews",status:"in_progress",owner:"Avery Quinn",next_step:"Identify the three most repeated desk-space frustrations.",depends_on:[]},
  {id:"task-launch-offer",parent:"initiative-d2c-launch",venture:"venture-acme",title:"Draft the starter-kit offer",status:"planned",owner:"Avery Quinn",next_step:"Write a plain-language headline and three concrete benefits.",depends_on:[]},
  {id:"restricted-1",parent:"initiative-d2c-launch",venture:"venture-acme",restricted:true,status:"planned",depends_on:[]}
];
/* Placeholder ventures: invented, home tiles only, no drill-down. */
const samples = [
  {id:"sample-northwind",title:"Sample: Northwind Bakery Co.",mix:{planned:4,in_progress:3,blocked:2,done:5},next:"Sample milestone: holiday menu test",agent:"sample-agent",ago:"2h ago",did:"moved 2 tasks to in progress"},
  {id:"sample-logistics",title:"Sample: Placeholder Logistics",mix:{planned:6,in_progress:2,blocked:0,done:8},next:"Sample milestone: route plan v2",agent:"sample-agent",ago:"35m ago",did:"added a dependency"},
  {id:"sample-studio",title:"Sample: Lorem Ipsum Studio",mix:{planned:2,in_progress:4,blocked:1,done:3},next:"Sample milestone: portfolio refresh",agent:"sample-agent",ago:"5h ago",did:"updated a next step"},
  {id:"sample-rentals",title:"Sample: Demo Rentals Group",mix:{planned:5,in_progress:1,blocked:0,done:1},next:"Sample milestone: listing checklist",agent:"sample-agent",ago:"1d ago",did:"created an initiative"},
  {id:"sample-media",title:"Sample: Test Pattern Media",mix:{planned:3,in_progress:2,blocked:0,done:6},next:"Sample milestone: episode outline",agent:"sample-agent",ago:"3h ago",did:"marked a task done"}
];
const STATUS = {planned:"Planned",in_progress:"In progress",blocked:"Blocked",done:"Done"};
const ORDER = ["done","in_progress","blocked","planned"];
const byId = id => tasks.find(t=>t.id===id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* ?static in the URL freezes motion (used for screenshots), same as prefers-reduced-motion */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches || /[?&]static/.test(location.search);
if(reduce)document.documentElement.classList.add("still");
const tz = {timeZone:"America/Phoenix"};
function rel(iso){const m=Math.max(0,Math.round((Date.now()-new Date(iso))/60000));if(m<60)return m+"m ago";const h=Math.round(m/60);if(h<48)return h+"h ago";return Math.round(h/24)+"d ago"}
function fmt(iso){return new Date(iso).toLocaleString("en-US",{...tz,month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})+" MST"}
function mixOf(list){const m={planned:0,in_progress:0,blocked:0,done:0};list.forEach(t=>m[t.status]++);return m}
function pill(s){return `<span class="pill s-${s}">${STATUS[s]}</span>`}
function segbar(m){const tot=Object.values(m).reduce((a,b)=>a+b,0)||1;
  return `<div class="seg grow" role="img" aria-label="${ORDER.map(k=>m[k]+' '+STATUS[k].toLowerCase()).join(', ')}">${ORDER.filter(k=>m[k]).map(k=>`<i class="c-${k}" style="width:${m[k]/tot*100}%"></i>`).join("")}</div>
  <div class="legend">${ORDER.map(k=>`<span><span class="sw c-${k}"></span><b>${m[k]}</b>${STATUS[k]}</span>`).join("")}</div>`}
const LOCK = s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg>`;
function taskTitle(t){return t.restricted?`<span class="lock">${LOCK(14)}</span> Restricted record`:esc(t.title)}
function crumbs(parts){return `<nav class="crumbs" aria-label="Breadcrumb"><a class="back" href="${parts.length>1?parts[parts.length-2][1]:'#/'}">&larr; Back</a>${parts.map((p,i)=>i===parts.length-1?`<span aria-current="page">${esc(p[0])}</span>`:`<a href="${p[1]}">${esc(p[0])}</a><span class="mono" aria-hidden="true">/</span>`).join("")}</nav>`}

/* ===== VIEWS ===== */
const main = document.getElementById("main");
function home(){
  const open = tasks.filter(t=>t.status!=="done").length, blocked = tasks.filter(t=>t.status==="blocked").length;
  const updatedToday = ventures.length+initiatives.length+tasks.length;
  const bt = tasks.find(t=>t.status==="blocked"), dep = byId(bt.depends_on[0]);
  let h = `<div class="fade-in"><h1>Good afternoon. Here is every venture at a glance.</h1><p class="lede">Click any tile for initiatives and tasks. Red means something is stuck.</p>
  <section class="strip" aria-label="Summary">
    <div class="panel ticks stat"><span class="mono">Ventures</span><span class="num" data-count="${ventures.length+samples.length}">0</span><span class="sub">${ventures.length} from records, ${samples.length} sample tiles</span></div>
    <div class="panel ticks stat cy"><span class="mono">Open tasks</span><span class="num" data-count="${open}">0</span><span class="sub">in record ventures (${tasks.length} total)</span></div>
    <div class="panel ticks stat alert"><span class="mono">Blocked</span><span class="num" data-count="${blocked}">0</span><span class="sub">needs a decision or input</span></div>
    <div class="panel ticks stat"><span class="mono">Agent writes today</span><span class="num" data-count="${updatedToday}">0</span><span class="sub">record versions dated today (chief-of-staff)</span></div>
  </section>
  <button class="panel attn" data-task="${bt.id}"><span class="tag">BLOCKED</span><span><strong>${esc(bt.title)}</strong> in Ridgeview HOA is waiting on <strong>${esc(dep.title)}</strong>.</span><span class="go">See details &rarr;</span></button>
  <div class="section-h"><h2>Ventures</h2><span class="mono">${ventures.length+samples.length} total</span></div><div class="grid">`;
  ventures.forEach((v,i)=>{const vt=tasks.filter(t=>t.venture===v.id),m=mixOf(vt),ni=initiatives.filter(x=>x.venture===v.id).length;

function chain(id){const up=new Set(),down=new Set();

function initMap(){

    mmv.setAttribute("x",vx);mmv.setAttribute("y",vy);mmv.setAttribute("width",Math.max(0,vx2-vx));mmv.setAttribute("height",Math.max(0,vy2-vy))};

  const measure=()=>{const r=wrap.getBoundingClientRect();W=r.width;H=r.height;return r};
  const fit=()=>{measure();const top=56;s=Math.min(W/1120,(H-top)/650,1.3);tx=(W-1100*s)/2;ty=top+(H-top-630*s)/2-10*s;apply()};
  const zoom=(f,cx,cy)=>{cx=cx??W/2;cy=cy??H/2;const ns=Math.min(2.5,Math.max(.4,s*f));tx=cx-(cx-tx)*ns/s;ty=cy-(cy-ty)*ns/s;s=ns;schedule()};

  wrap.addEventListener("wheel",e=>{e.preventDefault();const r=wrap.getBoundingClientRect();zoom(e.deltaY<0?1.1:1/1.1,e.clientX-r.left,e.clientY-r.top)},{passive:false});
  let drag=null;
  wrap.addEventListener("pointerdown",e=>{if(e.target.closest(".maptools,.node,.minimap"))return;drag={x:e.clientX,y:e.clientY,tx,ty};wrap.classList.add("drag");wrap.setPointerCapture(e.pointerId)});
  wrap.addEventListener("pointermove",e=>{if(!drag)return;tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;schedule()});

function showCard(el,x,y){const t=byId(el.dataset.task);if(!t)return;hcTarget=el;hcard.innerHTML=cardHTML(t);hcard.classList.toggle("locked",!!t.restricted);hcX=x;hcY=y;if(!hcRaf)hcRaf=requestAnimationFrame(()=>{placeCard();hcard.classList.add("on");requestAnimationFrame(()=>{hcH=hcard.offsetHeight||hcH})});el.setAttribute("aria-describedby","hcard")}
function hideCard(){if(hcTarget)hcTarget.removeAttribute("aria-describedby");hcTarget=null;hcard.classList.remove("on")}
function anchorUnder(el){const r=el.getBoundingClientRect();hcAnchored=true;showCard(el,r.left-16,r.bottom-8)}
document.addEventListener("pointerover",e=>{const el=e.target.closest(".task[data-task],.node[data-task]");if(el&&el!==hcTarget){if(el.classList.contains("node"))anchorUnder(el);else{hcAnchored=false;showCard(el,e.clientX,e.clientY)}}else if(!el&&hcTarget)hideCard()});
document.addEventListener("pointermove",e=>{if(!hcTarget||hcAnchored)return;hcX=e.clientX;hcY=e.clientY;if(!hcRaf)hcRaf=requestAnimationFrame(placeCard)},{passive:true});
document.addEventListener("focusin",e=>{const el=e.target.closest&&e.target.closest(".task[data-task],.node[data-task]");if(el){if(el.classList.contains("node"))anchorUnder(el);else{const r=el.getBoundingClientRect();hcAnchored=false;showCard(el,r.left+Math.min(r.width,260)-20,r.top+r.height/2)}}else if(hcTarget)hideCard()});
addEventListener("scroll",()=>hcTarget&&hideCard(),{passive:true});

/* ===== TILT + GLARE (rAF; transform only; fine pointers only) ===== */
const finePointer=matchMedia("(hover: hover) and (pointer: fine)");
/* ?tilt=force enables tilt where the device reports no fine pointer (headless capture/testing only) */
const forceTilt=/[?&]tilt=force/.test(location.search);const MAXT=6;
let tEl=null,tGlare=null,tRect=null,tX=0,tY=0,tRaf=0;
function tiltFrame(){tRaf=0;if(!tEl)return;if(!tRect)tRect=tEl.getBoundingClientRect();const r=tRect;
  const nx=Math.min(1,Math.max(0,(tX-r.left)/r.width)),ny=Math.min(1,Math.max(0,(tY-r.top)/r.height));
  tEl.style.transform=`rotateX(${((.5-ny)*MAXT).toFixed(2)}deg) rotateY(${((nx-.5)*MAXT).toFixed(2)}deg) translateY(-4px)`;
  if(tGlare)tGlare.style.transform=`translate3d(${(nx*r.width).toFixed(1)}px,${(ny*r.height).toFixed(1)}px,0)`}
function settle(el){el.classList.remove("hot");el.style.transform="";el.style.willChange=""}
document.addEventListener("pointermove",e=>{
  if(reduce||!(finePointer.matches||forceTilt)||e.pointerType!=="mouse")return;
  const t=e.target.closest(".tile");
  if(t!==tEl){if(tEl)settle(tEl);tEl=t;tRect=null;if(t){t.classList.add("hot");t.style.willChange="transform";tGlare=t.querySelector(".glare i")}}
  if(!t)return;tX=e.clientX;tY=e.clientY;if(!tRaf)tRaf=requestAnimationFrame(tiltFrame)},{passive:true});
document.addEventListener("pointerleave",()=>{if(tEl){settle(tEl);tEl=null}});
addEventListener("scroll",()=>{tRect=null},{passive:true});

/* ===== THEME ===== */
const root=document.documentElement,themeBtn=document.getElementById("themeToggle"),themeMQ=matchMedia("(prefers-color-scheme: light)");
function syncThemeBtn(){const cur=root.dataset.theme,next=cur==="dark"?"light":"dark";
  themeBtn.setAttribute("aria-label",`Theme: ${cur}. Switch to ${next} mode`);themeBtn.title=`Switch to ${next} mode`;
  document.getElementById("themeLabel").textContent=cur==="dark"?"Dark":"Light"}
function setTheme(t,persist){const go=()=>{root.dataset.theme=t;syncThemeBtn()};
  if(persist){try{localStorage.setItem("chassis-theme",t)}catch(e){}root.removeAttribute("data-theme-session")}
  if(document.startViewTransition&&!reduce)document.startViewTransition(go);else go()}
themeBtn.addEventListener("click",()=>setTheme(root.dataset.theme==="dark"?"light":"dark",true));
themeMQ.addEventListener("change",e=>{let s=null;try{s=localStorage.getItem("chassis-theme")}catch(_){}
  if(!s&&!root.hasAttribute("data-theme-session"))setTheme(e.matches?"light":"dark",false)});
syncThemeBtn();

/* ===== ROUTER + TRANSITIONS ===== */
function countUp(){document.querySelectorAll("[data-count]").forEach((el,i)=>{const n=+el.dataset.count;if(reduce||!n){el.textContent=n;return}
  el.textContent="0";const delay=i*70,d=850;let t0=null;const step=t=>{if(t0===null)t0=t+delay;const p=Math.max(0,Math.min(1,(t-t0)/d));el.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
function stagger(){document.querySelectorAll(".grow").forEach((el,i)=>el.style.setProperty("--d",(120+i*70)+"ms"))}
function route(){
  const [path,query]=(location.hash.slice(1)||"/").split("?");const parts=path.split("/").filter(Boolean);
  let html,tab="home";
  if(!parts.length)html=home();else if(parts[0]==="v")html=ventureView(parts[1]);else if(parts[0]==="i")html=initView(parts[1]);else if(parts[0]==="map"){html=mapView();tab="map"}else html=notFound();
  if(tEl){tEl=null}hideCard();
  main.innerHTML=html;
  document.querySelectorAll("nav.tabs a").forEach(a=>a.dataset.tab===tab?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  stagger();countUp();
  if(tab==="map")initMap();
  closeDrawer();window.scrollTo(0,0);
  const qp=new URLSearchParams(query||"");if(qp.has("ask"))askAnswer(qp.get("ask"));if(qp.has("task"))taskDetail(qp.get("task"));
}
let hero=null;
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-task]");if(el){e.preventDefault();e.stopPropagation();taskDetail(el.dataset.task);return}
  const a=e.target.closest('a[href^="#/v/"],a[href^="#/i/"]');hero=a?a.closest(".tile,.init"):null;
});
addEventListener("hashchange",()=>{
  if(!document.startViewTransition||reduce){route();return}
  const src=hero;hero=null;if(src){settle(src);src.style.viewTransitionName="hero"}
  root.classList.add("vt-nav");
  const vt=document.startViewTransition(()=>{if(src)src.style.viewTransitionName="";route();
    const dst=src&&main.querySelector(".vhead .panel");if(dst)dst.style.viewTransitionName="hero"});
  vt.finished.finally(()=>{root.classList.remove("vt-nav");const d=main.querySelector('[style*="view-transition-name"]');if(d)d.style.viewTransitionName=""});
});
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();document.getElementById("ask").focus();return}
  if(e.key==="Escape"){if(drawer.classList.contains("on")){closeDrawer();return}hideCard()}
  const r=e.target.closest&&e.target.closest('[role="button"][data-task]');if(r&&(e.key==="Enter"||e.key===" ")){e.preventDefault();taskDetail(r.dataset.task)}
});
scrim.onclick=closeDrawer;document.getElementById("drawerClose").onclick=closeDrawer;
document.getElementById("askForm").addEventListener("submit",e=>{e.preventDefault();askAnswer(document.getElementById("ask").value.trim())});
if(/Mac|iPhone|iPad/.test(navigator.platform))document.getElementById("kbdhint").textContent="\u2318 K";
const tick=()=>document.getElementById("clock").textContent=new Date().toLocaleTimeString("en-US",{...tz,hour:"numeric",minute:"2-digit"});tick();setInterval(tick,30000);
route();
</script>
</body>
</html>
